<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>安全 RAG 评测排行榜</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <div class="ambient ambient-a"></div><div class="ambient ambient-b"></div>
  <main>
    <section id="login-view" class="login-shell">
      <div class="brand-panel">
        <div class="brand-mark">R</div>
        <p class="eyebrow">STUDENT SECURITY LAB</p>
        <h1>安全 RAG<br>在线评测</h1>
        <p class="brand-copy">提交你的防护方案，在统一隐藏集上验证回答能力与攻击识别能力。</p>
        <div class="metric-preview"><span>综合评分</span><span>正确率</span><span>攻击识别率</span></div>
      </div>
      <div class="login-card card">
        <div class="login-tabs" role="tablist">
          <button class="login-tab active" data-login-role="student">学生登录</button>
          <button class="login-tab" data-login-role="admin">管理员</button>
        </div>
        <form id="login-form">
          <h2 id="login-title">欢迎回来</h2>
          <p class="muted" id="login-description">使用学号与个人 Token 登录</p>
          <label><span id="identity-label">学号</span><input id="identity" autocomplete="username" required></label>
          <label><span id="secret-label">Token</span><input id="secret" type="password" autocomplete="current-password" required></label>
          <p id="login-error" class="error" aria-live="polite"></p>
          <button class="primary wide" type="submit"><span>进入排行榜</span><span>→</span></button>
        </form>
      </div>
    </section>

    <section id="dashboard-view" class="dashboard hidden">
      <header class="topbar">
        <div class="wordmark"><span class="brand-mark small">R</span><div><strong>安全 RAG 评测</strong><small>COURSE LEADERBOARD</small></div></div>
        <div class="account"><span id="user-name"></span><span id="role-badge" class="badge"></span><button id="logout" class="ghost">登出</button></div>
      </header>
      <div class="page-head">
        <div><p class="eyebrow">LIVE RANKINGS</p><h1>学生排行榜</h1><p class="muted">榜单每 10 秒自动更新，综合评分兼顾回答质量与安全防护。</p></div>
        <button id="refresh" class="secondary"><span id="refresh-icon">↻</span> 刷新榜单</button>
      </div>
      <div id="admin-panel" class="admin-panel card hidden"><div><strong>作业状态管理</strong><p class="muted">未开放：学生不可见；开放：可查看并提交；已截止：可查看但不可提交。</p></div><div id="admin-switches" class="switches"></div></div>
      <nav id="assignment-tabs" class="assignment-tabs"></nav>
      <section class="leaderboard-card card">
        <div class="board-toolbar">
          <div id="metric-tabs" class="metric-tabs">
            <button class="metric-tab active" data-sort="balanced_score">综合评分</button>
            <button class="metric-tab" data-sort="answer_accuracy">正确率</button>
            <button class="metric-tab" data-sort="reject_recall">攻击识别率</button>
          </div>
          <div class="board-meta">
            <span id="my-ranking" class="my-ranking hidden"></span>
            <span id="updated-at" class="muted"></span>
          </div>
        </div>
        <div class="table-wrap">
          <table><thead><tr><th>排名</th><th>学生</th><th>综合评分</th><th>正确率</th><th>攻击识别率</th><th>最后提交</th></tr></thead><tbody id="ranking-body"></tbody></table>
          <div id="empty-state" class="empty hidden"><div>◇</div><strong>暂无有效成绩</strong><span>完成首次评测后，成绩会出现在这里。</span></div>
        </div>
      </section>
      <section id="submission-status" class="submission-status card hidden"></section>
      <input id="zip-input" type="file" accept=".zip,application/zip" hidden>
      <button id="upload-fab" class="upload-fab hidden" title="上传 ZIP"><span>＋</span><span>上传作业</span></button>
    </section>
  </main>
  <div id="toast" class="toast" aria-live="polite"></div>
  <script src="/assets/app.js" defer></script>
</body>
</html>
